# Local containers: `docker compose up --build`, then open http://localhost:8501
# (UI) or http://localhost:8000/docs (API). Both read secrets from .env and
# share one volume for sandbox ledgers and SQLite checkpoints.
x-agent: &agent
  build: .
  image: revenue-leakage-agent:dev
  env_file:
    - path: .env
      required: false
  environment:
    SANDBOX_DIR: /app/state/sandbox
    CHECKPOINT_DB: /app/state/checkpoints.sqlite
  volumes:
    - agent-state:/app/state
  restart: unless-stopped

services:
  ui:
    <<: *agent
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    <<: *agent
    command: ["uvicorn", "revenue_leakage_agent.interfaces.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  agent-state:
