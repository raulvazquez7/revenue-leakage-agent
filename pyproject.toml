[project]
name = "revenue-leakage-agent"
version = "0.1.0"
description = "Stateful LangGraph agent that detects revenue leakage between billing plans and invoices, with human-in-the-loop corrections."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "langchain-core==1.6.4",
    "langchain-openai==1.6.4",
    "langfuse==4.15.4",
    "langgraph==1.2.12",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "streamlit==1.64.0",
    "uvicorn[standard]==0.53.0",
]

[project.scripts]
revenue-leakage-agent = "revenue_leakage_agent.interfaces.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revenue_leakage_agent"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "taskipy>=1.14.1",
]

[tool.taskipy.tasks]
format = "ruff format ."
lint = "ruff check ."
typecheck = "pyright"
test = "pytest"
check = "ruff format --check . && ruff check . && pyright"
precommit = "pre-commit run --all-files"
ui = "streamlit run src/revenue_leakage_agent/interfaces/streamlit_app.py"
cli = "revenue-leakage-agent"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-q",
    "--strict-markers",
    "--strict-config",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false

[tool.coverage.run]
source = ["revenue_leakage_agent"]
branch = true
