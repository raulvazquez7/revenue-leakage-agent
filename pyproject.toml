[project]
name = "revenue-leakage-agent"
version = "0.1.0"
description = "Stateful LangGraph agent that detects revenue leakage between billing plans and invoices, with human-in-the-loop corrections."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.139.0",
    "langchain-core==1.4.8",
    "langchain-openai==1.3.3",
    "langfuse==4.13.0",
    "langgraph==1.2.7",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "streamlit==1.58.0",
    "uvicorn[standard]==0.50.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "taskipy>=1.14.0",
]

[tool.uv]
package = false

[tool.taskipy.tasks]
format = "ruff format ."
lint = "ruff check ."
typecheck = "pyright"
test = "pytest"
check = "ruff format --check . && ruff check . && pyright"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-q",
    "--strict-markers",
    "--strict-config",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["agents", "scripts", "settings", "tests", "ui"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pyright]
include = ["agents", "scripts", "settings", "tests", "ui"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
